<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHS SÉNÉGAL · Le chantier sans souci</title>
<meta name="description" content="Immobilier, BTP, décoration, matériel de décoration et quincaillerie au Sénégal.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap');
:root{--bao:#115291;--bao2:#1B6AAE;--ocre:#EB8A2D;--argile:#C8102E;--sable:#EEF3F9;--bg:#F3F6FA;--nuit:#171A16;--brume:#E4E2DC;--pierre:#6B6F66;--ok:#2F6B4F;--ko:#A23B2A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--nuit);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:Fraunces,Georgia,serif;color:var(--bao);line-height:1.2}
h1{font-size:1.4rem} h2{font-size:1.3rem;margin:8px 0 12px} h3{font-size:1.05rem;margin:0 0 6px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.btn{background:var(--bao);color:var(--sable);border:0;padding:10px 16px;border-radius:10px;font-weight:700}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:#fff;color:var(--bao);border:1.5px solid var(--bao)}
.btn.orange{background:var(--ocre);color:var(--nuit);border:0}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--brume);border-radius:10px;background:#fff;color:var(--nuit)}
select{width:auto;min-width:120px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--pierre);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--pierre)}
.prix{font-weight:800;color:var(--argile);font-size:1.02rem}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--brume)}
.tag.ok{background:#DCEFE4;color:var(--ok)}
.tag.ko{background:#F6DEDA;color:var(--ko)}
.box{background:#fff;border:1px solid var(--brume);border-radius:14px;padding:16px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:#fff;border:1px solid var(--brume);border-radius:20px;padding:24px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--bao)}
.tile:hover{border-color:var(--ocre)}
.tile span{font-size:40px}
.tile b{font-size:13px;letter-spacing:.04em}
.cathead{display:flex;align-items:center;gap:12px;padding:14px 16px 0;flex-wrap:wrap}
.cathead h2{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 24px}
@media(min-width:720px){.fgrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
.desc{color:var(--pierre);font-size:13px}
.pbody p{font-size:13px;margin:0}
.kpi.clic{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;background:#FBFAF6}
.kpi.clic:hover{border-color:var(--ocre)}
.totaux{max-width:320px;margin:12px 0 0 auto}
.totaux div{display:flex;justify-content:space-between;padding:4px 0}
.totaux .grand{font-weight:800;border-top:2px solid var(--bao);color:var(--bao);margin-top:4px;padding-top:8px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--brume);border-radius:14px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--brume);vertical-align:top}
th{background:#F7F5EF;color:var(--bao)}
.bar{height:8px;background:var(--brume);border-radius:99px;overflow:hidden;margin:8px 0}
.bar span{display:block;height:100%;background:var(--ocre)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips span{background:#fff;border:1px solid var(--brume);padding:6px 12px;border-radius:99px;font-size:13px}

/* ---------- Espace équipe : rail d'icônes + contenu ---------- */
.app{display:flex;min-height:100vh}
.rail{width:72px;background:var(--bao);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;flex-shrink:0;position:sticky;top:0;height:100vh}
.rail-logo{padding:4px 0 14px}
.rail nav{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto;width:100%;align-items:center}
.ri{position:relative;width:50px;height:50px;border-radius:14px;border:0;background:transparent;font-size:20px;display:grid;place-items:center;opacity:.72;flex-shrink:0}
.ri:hover{background:rgba(255,255,255,.08);opacity:1}
.ri.on{background:var(--ocre);opacity:1;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.nb{position:absolute;top:2px;right:0;background:#D9432E;color:#fff;font-size:11px;font-style:normal;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--brume);flex-wrap:wrap;position:sticky;top:0;z-index:4}
.top small{font-size:12px}
.content{padding:16px 20px 40px}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
details.acc{background:#fff;border:1px solid var(--brume);border-radius:16px;padding:12px 16px;margin-bottom:12px}
details.acc summary{cursor:pointer;font-weight:800;color:var(--bao);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{margin-bottom:12px}
.pill{background:var(--brume);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--bao);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{border:1px solid var(--brume);border-radius:14px;padding:12px;background:#FBFAF6}
.kpi small{color:var(--pierre);display:block;line-height:1.3}
.kpi b{display:block;font-size:1.1rem;color:var(--bao);margin-top:6px;word-break:break-word}

/* ---------- Boutique client ---------- */
.shop-head{background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer}
.logo-img{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#fff;flex-shrink:0;display:block}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ocre);color:var(--nuit);display:grid;place-items:center;font-weight:800;font-family:Fraunces,serif;flex-shrink:0}
.brand b{display:block;font-family:Fraunces,serif;font-size:16px;color:var(--bao)}
.brand small{display:block;font-size:10px;letter-spacing:.1em;color:var(--argile);font-weight:800}
.head-acts{display:flex;gap:8px;align-items:center}
.ico{background:none;border:0;font-size:20px;padding:6px}
.cartpill{background:var(--bao);color:#fff;border:0;border-radius:99px;padding:9px 16px;font-weight:700}
.cartpill b{margin-left:6px;color:var(--ocre)}
.promo{margin:12px 16px 0;background:linear-gradient(90deg,var(--ocre),var(--argile));color:#fff;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.promo b{display:block;font-family:Fraunces,serif;font-size:1.05rem}
.promo button{background:rgba(255,255,255,.25);border:0;color:#fff;width:30px;height:30px;border-radius:99px;flex-shrink:0}
.hero-b{margin:14px 16px 0;background:var(--bao);color:var(--sable);border-radius:20px;padding:22px}
.hero-b .kicker{color:var(--ocre);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hero-b h1{color:#fff;font-size:1.45rem;margin:6px 0 8px}
.hero-b p{color:#d9d3c2;font-size:14px}
.hero-b .btn{margin-top:12px}
.search{margin:14px 16px 0;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ocre);border-radius:99px;padding:10px 18px}
.search input{border:0;padding:0;background:transparent;font-size:15px;outline:none}
.cats{display:flex;gap:12px;overflow-x:auto;padding:18px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--bao);width:84px}
.cat span{width:70px;height:70px;border-radius:99px;background:#fff;border:2px solid var(--brume);display:grid;place-items:center;font-size:26px}
.cat.on span{border-color:var(--ocre);box-shadow:0 0 0 4px rgba(226,162,59,.25)}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.chip{flex:none;background:#fff;border:1.5px solid var(--brume);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--bao)}
.chip.on{background:var(--bao);color:#fff;border-color:var(--bao)}
.sec{padding:10px 16px 6px}
.sec-h{display:flex;align-items:center;gap:12px;margin:12px 0}
.sec-ic{width:50px;height:50px;border-radius:99px;background:#fff;border:1px solid var(--brume);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.sec-h h2{margin:0;font-size:1.3rem}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.pgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.pcard{background:#fff;border:1px solid var(--brume);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pimg{height:110px;background:#F5EEDC;display:grid;place-items:center;font-size:44px}
.pbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{font-size:.95rem;margin:0;font-family:Manrope,sans-serif;font-weight:700;color:var(--nuit)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hscroll .pcard{flex:none;width:240px}
.svc{background:#fff;border:1px solid var(--brume);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.svc p{color:var(--pierre);font-size:14px}
.ptail{padding:24px 16px 40px;color:var(--pierre);text-align:center;font-size:13px}
.shop-page{padding:16px}
.pub-foot{text-align:center;color:var(--pierre);padding:24px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(23,26,22,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:#fff;border-radius:18px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dh button{background:none;border:0;font-size:18px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nuit);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#115291,#0B3560)}
.login-card{background:#fff;border-radius:22px;padding:28px 24px;width:min(400px,100%);text-align:center}
.login-card h1{font-size:1.4rem;margin-bottom:4px}
.login-card .fld{text-align:left}
.login-logo{width:150px;height:150px;object-fit:contain;border-radius:50%;background:#fff;margin:0 auto 10px;display:block}
@media(max-width:700px){.content{padding:12px}.top{padding:12px 14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===================== CONFIGURATION ===================== */
const KEY = 'bhs_senegal_v2';
/* Codes d'accès PROVISOIRES. Ils sont lisibles dans ce fichier : à changer avant toute mise en ligne,
   et à remplacer par une vraie authentification (voir Phase 1 : sessions et rôles en base). */
const ACCESS = {pdg:'PDG-2026', responsable:'RESP-2026', commercial:'COM-2026', comptable:'COMP-2026', stock:'STK-2026', chef:'CHEF-2026', ouvrier:'OUV-2026', service:'SRV-2026'};
const ROLE_LABELS = {pdg:'PDG / Direction', responsable:'Responsable de département', commercial:'Commercial', comptable:'Comptable', stock:'Gestionnaire de stock', chef:'Chef de chantier', ouvrier:'Ouvrier intégré', service:'Service client'};
const MENU = [
  {id:'dashboard',  label:'Tableau de bord',   roles:['pdg','responsable','comptable']},
  {id:'demandes',   label:'Demandes & devis',  roles:['pdg','responsable','commercial','service']},
  {id:'commandes',  label:'Commandes boutique',         roles:['pdg','responsable','commercial','stock','comptable']},
  {id:'devis',      label:'Devis',             roles:['pdg','responsable','commercial','chef']},
  {id:'factures',   label:'Factures',          roles:['pdg','responsable','commercial','comptable']},
  {id:'immobilier', label:'Immobilier',        roles:['pdg','responsable','commercial']},
  {id:'chantiers',  label:'Chantiers BTP',     roles:['pdg','responsable','chef']},
  {id:'ouvriers',   label:'Ouvriers intégrés', roles:['pdg','responsable','chef']},
  {id:'personnel',  label:'Personnel',         roles:['pdg','responsable']},
  {id:'stock',      label:'Stock & produits',  roles:['pdg','responsable','stock']},
  {id:'clients',    label:'Clients',           roles:['pdg','responsable','commercial','service']},
  {id:'planning',   label:'Mon planning',      roles:['ouvrier']},
  {id:'parametres', label:'Paramètres',        roles:['pdg']}
];
const SERVICES = [
  {id:'immobilier', nom:'Immobilier', desc:'Achat, vente et location de maisons, appartements, terrains et locaux.', cta:'Voir les biens'},
  {id:'btp', nom:'BTP', desc:'Travaux de construction et de rénovation réalisés par nos ouvriers intégrés.', cta:'Demander un devis'},
  {id:'deco', nom:'Décoration', desc:'Aménagement intérieur et décoration de vos pièces, de l\'idée à la réalisation.', cta:'Demander un devis'},
  {id:'materiel', nom:'Matériel de décoration', desc:'Luminaires, papiers peints, miroirs et accessoires, disponibles en boutique.', cta:'Voir les produits'},
  {id:'quincaillerie', nom:'Quincaillerie', desc:'Ciment, fer, peinture, plomberie, électricité et outillage.', cta:'Voir les produits'}
];
const METIERS_BTP = ['Maçonnerie','Électricité','Plomberie','Peinture','Carrelage','Menuiserie bois','Menuiserie aluminium','Plâtrerie et faux plafonds','Charpente et couverture','Construction neuve','Rénovation complète'];
const PIECES = ['Salon','Chambre','Cuisine','Salle de bains','Bureau','Terrasse','Autre'];
const STATUT_CMD = ['En attente','Confirmée','En préparation','En livraison','Livrée','Annulée'];
const STATUT_DEM = ['Nouvelle','En cours','Devis envoyé','Gagnée','Perdue'];
const STATUT_BIEN = ['brouillon','publie','vendu','loue'];

/* ===================== UTILITAIRES ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa = n => (Number(n) || 0).toLocaleString('fr-FR') + ' F CFA';
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nowIso = () => new Date().toISOString().slice(0, 10);
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const inp = (id, label, type = 'text') => `<div class="fld"><label for="${id}">${label}</label><input id="${id}" type="${type}"></div>`;
const sel = (id, label, opts) => `<div class="fld"><label for="${id}">${label}</label><select id="${id}">${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`;
const selStatut = (fn, id, opts, cur) => `<select onchange="${fn}('${id}',this.value)">${opts.map(o => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
const table = (h, rows) => `<div class="tw"><table><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${h.length}" class="muted">Aucune donnée pour le moment</td></tr>`}</tbody></table></div>`;
const kpis = arr => `<div class="kpis">${arr.map(([l, v, t]) => t ? `<button class="kpi clic" onclick="goI('${t}')"><small>${l}</small><b>${v}</b></button>` : `<div class="kpi"><small>${l}</small><b>${v}</b></div>`).join('')}</div>`;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600);
}
function openModal(title, body){
  $('#modal').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dh"><b>${title}</b><button onclick="closeModal()" aria-label="Fermer">✕</button></div>${body}</div></div>`;
}
function closeModal(){ $('#modal').innerHTML = ''; }

/* ===================== DONNÉES (vides au démarrage) ===================== */
let db, mode = 'login', page = 'accueil', S = {role: null}, filtreTx = 'Tous', dernierNumero = '';

function seed(){
  return {
    compteur: 0,
    societe: {nom:'BHS Sénégal', tel:'', adresse:'', whatsapp:''},
    personnel: [],
    ouvriers: [],
    biens: [],
    produits: [],
    chantiers: [],
    demandes: [],
    commandes: [],
    factures: [],
    devis: [],
    compteurDevis: 0,
    signature: '',
    cachet: '',
    panier: []
  };
}
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

/* ===================== LOGIQUE MÉTIER ===================== */
const ouvrierOccupe = id => db.chantiers.some(c => c.statut === 'En cours' && c.equipe.includes(id));
const stockSuffisant = c => c.lignes.every(l => { const p = db.produits.find(x => x.id === l.produitId); return p && p.stock >= l.qte; });
function ajusterStock(c, sens){
  c.lignes.forEach(l => { const p = db.produits.find(x => x.id === l.produitId); if(p) p.stock = Math.max(0, p.stock + sens * l.qte); });
  c.stockSorti = sens < 0;
}
const lignesPanier = () => db.panier.map(l => { const p = db.produits.find(x => x.id === l.id); return p ? {id:p.id, nom:p.nom, prix:p.prix, qte:l.qte} : null; }).filter(Boolean);

/* ===================== NAVIGATION ===================== */
/* Ouverture : la gestion (connexion) s'affiche en premier.
   La boutique s'ouvre directement si le lien contient #boutique (lien partageable). */
const SHOP_HASH = '#boutique';
function render(){
  const app = $('#app');
  if(mode === 'interne' && S.role) app.innerHTML = shellInterne();
  else if(mode === 'public') app.innerHTML = shellPublic();
  else { app.innerHTML = shellLogin(); majLoginRole(); }
}
function go(p){ mode = 'public'; page = p; setHash(true); render(); window.scrollTo(0, 0); }
function goI(p){ if(!canSee(p)) return; mode = 'interne'; page = p; render(); }
function goPublic(){ mode = 'public'; page = 'accueil'; setHash(true); render(); window.scrollTo(0, 0); }
function goLogin(){ mode = 'login'; setHash(false); render(); }
function setHash(shop){
  const base = location.pathname + location.search;
  history.replaceState(null, '', shop ? base + SHOP_HASH : base);
}
function lienBoutique(){
  const u = location.href.split('#')[0] + SHOP_HASH;
  if(navigator.clipboard){
    navigator.clipboard.writeText(u).then(() => toast('Lien copié : ' + u), () => prompt('Copiez ce lien :', u));
  } else prompt('Copiez ce lien :', u);
}
function canSee(id){ const m = MENU.find(x => x.id === id); return !!(m && S.role && m.roles.includes(S.role)); }
function firstPage(){ return MENU.find(m => m.roles.includes(S.role)).id; }
window.addEventListener('hashchange', () => {
  if(location.hash === SHOP_HASH){ mode = 'public'; page = 'accueil'; }
  else if(!S.role) mode = 'login';
  render();
});

/* ===================== CONNEXION (gestion d'abord) ===================== */
const ROLE_OPTIONS = Object.keys(ROLE_LABELS).map(k => `<option value="${k}">${ROLE_LABELS[k]}</option>`).join('');

  const r = val('l-role'); const box = $('#l-extra'); if(!box) return;
  box.innerHTML = r === 'ouvrier'
    ? `<div class="fld"><label for="l-ouv">Votre nom</label><select id="l-ouv" style="width:100%">${db.ouvriers.map(o => `<option value="${o.id}">${esc(o.nom)}</option>`).join('')}</select></div>` : '';
}
function accessOf(r){ return (db.acces && db.acces[r]) || ACCESS[r]; }
function codesHtml(){
  return `<div class="box"><h3>Codes d'accès des rôles</h3>
    <p class="muted" style="margin-bottom:10px">Seul le PDG peut modifier ces codes. 4 caractères minimum.</p>
    <div class="grid2">${Object.keys(ROLE_LABELS).map(k => `<div class="fld"><label for="ac-${k}">${ROLE_LABELS[k]}</label><input id="ac-${k}" value="${esc(accessOf(k))}"></div>`).join('')}</div>
    <button class="btn" onclick="saveCodes()">Enregistrer les codes</button></div>`;
}
function saveCodes(){
  const nv = {};
  for(const k of Object.keys(ROLE_LABELS)){
    const v = val('ac-' + k);
    if(v.length < 4){ toast("Code trop court pour " + ROLE_LABELS[k] + " (4 caractères minimum)"); return; }
    nv[k] = v;
  }
  db.acces = nv; save(); render(); toast("Codes d'accès mis à jour");
}
function login(){
  const r = val('l-role'), code = document.getElementById('l-code').value;
  if(code !== accessOf(r)){ toast('Code incorrect'); return; }
  S = {role: r, ouvrierId: r === 'ouvrier' ? val('l-ouv') : null};
  mode = 'interne'; page = firstPage(); setHash(false); render();
}
function logout(){ S = {role: null}; mode = 'login'; setHash(false); render(); }

  <footer class="pub-foot">${esc(db.societe.nom)}${db.societe.adresse ? ' · ' + esc(db.societe.adresse) : ''}${db.societe.tel ? ' · Tél. ' + esc(db.societe.tel) : ''}</footer>`;
}
function setCat(id){ catFiltre = id; page = 'accueil'; mode = 'public'; setHash(true); render(); window.scrollTo(0, 0); }

function shopBody(){
  if(!catFiltre){
    return `<div class="tiles">${CATS.map(c => `<button class="tile" onclick="setCat('${c.id}')"><span>${c.icon}</span><b>${c.label}</b></button>`).join('')}</div>`;
  }
  const cat = CATS.find(c => c.id === catFiltre);
  return `<div class="cathead"><button class="btn ghost sm" onclick="setCat(null)">← Retour</button><h2>${cat.label}</h2></div>${detailCat(catFiltre)}`;
}
const vide = msg => `<p class="ptail">${msg}</p>`;
function detailCat(id){
  switch(id){
    case 'immobilier': {
      const b = db.biens.filter(x => x.statut === 'publie');
      return b.length ? `<div class="fgrid">${b.map(bienCard).join('')}</div>` : vide('Aucun bien publié pour le moment.');
    }
    case 'btp': return `<div class="fgrid">${METIERS_BTP.map(m => svcItem('BTP', m, '🏗️')).join('')}</div>`;
    case 'deco': return `<div class="fgrid">${PIECES.map(m => svcItem('Décoration', 'Pièce : ' + m, '🛋️')).join('')}</div>`;
    case 'materiel': {
      const p = db.produits.filter(x => x.cat === 'Décoration');
      return p.length ? `<div class="fgrid">${p.map(prodCard).join('')}</div>` : vide('Aucun produit pour le moment.');
    }
    case 'quincaillerie': {
      const p = db.produits.filter(x => x.cat === 'Quincaillerie');
      return p.length ? `<div class="fgrid">${p.map(prodCard).join('')}</div>` : vide('Aucun produit pour le moment.');
    }
    case 'ouvrage': {
      return db.chantiers.length ? `<div class="fgrid">${db.chantiers.map(ouvrageCard).join('')}</div>` : vide('Aucun ouvrage pour le moment.');
    }
    default: return '';
  }
}

function bienCard(b){
  return `<article class="pcard"><div class="pimg">🏠</div><div class="pbody">
    <span class="tag">${b.transaction === 'vente' ? 'À vendre' : 'À louer'}</span>
    <h3>${esc(b.titre)}</h3>
    ${fl('Type', b.type)}${fl('Transaction', b.transaction === 'vente' ? 'Vente' : 'Location')}
    ${fl('Ville', b.ville)}${fl('Quartier', b.quartier)}
    ${fl('Surface', b.surface ? b.surface + ' m²' : '')}${fl('Chambres', b.chambres)}
    ${fl('Prix', fcfa(b.prix) + (b.transaction === 'location' ? ' / mois' : ''))}
    ${fl('Statut', 'Disponible')}
    ${b.description ? `<p class="desc">${esc(b.description)}</p>` : ''}
    <button class="btn sm full" onclick="demandeVisite('${b.id}')">Demander une visite</button>
  </div></article>`;
}
function prodCard(p){
  return `<article class="pcard"><div class="pimg">${p.cat === 'Décoration' ? '🎨' : '🔧'}</div><div class="pbody">
    <span class="tag ${p.stock > 0 ? 'ok' : 'ko'}">${p.stock > 0 ? 'Disponible' : 'Rupture'}</span>
    <h3>${esc(p.nom)}</h3>
    ${fl('Catégorie', p.cat)}${fl('Marque', p.marque)}${fl('Unité de vente', p.unite)}
    ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
    <p class="prix">${fcfa(p.prix)}</p>
    <button class="btn sm full" ${p.stock <= 0 ? 'disabled' : ''} onclick="addPanier('${p.id}')">Ajouter au panier</button>
  </div></article>`;
}
function svcItem(type, titre, icon){
  return `<article class="pcard"><div class="pimg">${icon}</div><div class="pbody">
    <h3>${esc(titre)}</h3>
    <p class="desc">Demande de devis : ${esc(type)}</p>
    <button class="btn sm full" onclick="formDemande('${type}','${titre}','')">Demander un devis</button>
  </div></article>`;
}
function ouvrageCard(c){
  return `<article class="pcard"><div class="pimg">🧱</div><div class="pbody">
    <span class="tag">${esc(c.statut)}</span>
    <h3>${esc(c.nom)}</h3>
    ${fl('Lieu', c.lieu)}${fl('Début', c.debut)}${fl('Fin prévue', c.fin)}
    ${c.description ? `<p class="desc">${esc(c.description)}</p>` : ''}
    <p><span class="muted">Avancement :</span> ${c.avancement}%</p>
    <div class="bar"><span style="width:${c.avancement}%"></span></div>
    <button class="btn ghost sm full" onclick="demandeOuvrage('${c.id}')">Demander un ouvrage similaire</button>
  </div></article>`;
}
function demandeOuvrage(id){
  const c = db.chantiers.find(x => x.id === id); if(!c) return;
  formDemande('BTP', 'Ouvrage : ' + c.nom, '');
}

function publicPage(p){
  switch(p){
    case 'panier': {
      const L = lignesPanier();
      if(!L.length) return `<div class="shop-page"><h2>Votre panier</h2><p class="muted">Votre panier est vide.</p>
        <div class="row"><button class="btn" onclick="setCat('quincaillerie')">Quincaillerie</button><button class="btn ghost" onclick="setCat('materiel')">Matériel déco</button></div></div>`;
      const total = L.reduce((s, l) => s + l.prix * l.qte, 0);
      return `<div class="shop-page"><h2>Votre panier</h2>
        <div class="box">${L.map(l => `<div class="rowb" style="padding:10px 0;border-bottom:1px solid var(--brume)">
          <div><b>${esc(l.nom)}</b><div class="muted">${fcfa(l.prix)}</div></div>
          <div class="row" style="margin:0"><button class="btn sm ghost" onclick="majPanier('${l.id}',-1)">−</button><b>${l.qte}</b><button class="btn sm ghost" onclick="majPanier('${l.id}',1)">+</button></div>
          <b>${fcfa(l.prix * l.qte)}</b></div>`).join('')}
          <div class="rowb" style="margin-top:12px"><span>Total</span><b class="prix">${fcfa(total)}</b></div>
        </div>
        <div class="box"><h3>Vos coordonnées</h3>
          <div class="grid2">${inp('c-nom','Nom complet')}${inp('c-tel','Téléphone')}</div>
          <div class="grid2">${sel('c-mode','Mode de réception',['Livraison','Retrait en boutique'])}${inp('c-adr','Adresse de livraison')}</div>
          ${sel('c-paie','Paiement',['À la livraison','Espèces à la remise','Wave (confirmé par notre équipe)'])}
          <button class="btn full" onclick="passerCommande()">Confirmer la commande</button>
          <p class="muted" style="margin-top:8px;font-size:13px">Votre commande est enregistrée. Notre équipe la confirme avant la livraison ou le retrait.</p>
        </div></div>`;
    }
    case 'confirmation': return `<div class="shop-page"><h2>Merci !</h2>
      <p>Votre commande <b>${esc(dernierNumero)}</b> est enregistrée. Notre équipe vous contactera pour la confirmer.</p>
      <div class="row"><button class="btn" onclick="setCat(null)">Retour à la boutique</button></div></div>`;
    default: return `<div class="shop-page"><p>Page introuvable.</p></div>`;
  }
}

/* ===================== DEMANDES PUBLIQUES ===================== */
function formDemande(type, sujet, extra){
  openModal('Demande : ' + esc(type), `
    ${sujet ? `<p class="muted" style="margin-bottom:10px">${esc(sujet)}</p><input type="hidden" id="f-sujet" value="${esc(sujet)}">` : ''}
    ${extra || ''}
    ${inp('f-nom','Nom complet')}
    ${inp('f-tel','Téléphone')}
    ${inp('f-budget','Budget estimé (F CFA)','number')}
    <div class="fld"><label for="f-msg">Décrivez votre besoin</label><textarea id="f-msg" rows="4"></textarea></div>
    <button class="btn" onclick="envoyerDemande('${esc(type)}')">Envoyer la demande</button>`);
}
function demandeVisite(id){
  const b = db.biens.find(x => x.id === id); if(!b) return;
  formDemande('Immobilier', 'Visite : ' + b.titre, '');
}
function envoyerDemande(type){
  const nom = val('f-nom'), tel = val('f-tel');
  if(!nom || !tel){ toast('Nom et téléphone sont obligatoires'); return; }
  db.demandes.unshift({id:uid('r'), type, nom, tel, sujet: val('f-sujet') || val('f-metier'), budget: val('f-budget'), message: val('f-msg'), statut:'Nouvelle', date: nowIso()});
  save(); closeModal(); toast('Demande envoyée. Nous vous recontactons très vite.');
}

/* ===================== PANIER ET COMMANDES ===================== */
function addPanier(id){
  const p = db.produits.find(x => x.id === id);
  if(!p || p.stock <= 0){ toast('Produit indisponible'); return; }
  const l = db.panier.find(x => x.id === id);
  if(l){ if(l.qte >= p.stock){ toast('Stock maximum atteint'); return; } l.qte++; }
  else db.panier.push({id, qte:1});
  save(); render(); toast('Ajouté au panier');
}
function majPanier(id, d){
  const l = db.panier.find(x => x.id === id); if(!l) return;
  const p = db.produits.find(x => x.id === id);
  l.qte += d;
  if(l.qte <= 0) db.panier = db.panier.filter(x => x.id !== id);
  else if(p && l.qte > p.stock){ l.qte = p.stock; toast('Stock maximum atteint'); }
  save(); render();
}
function passerCommande(){
  const nom = val('c-nom'), tel = val('c-tel'), mode2 = val('c-mode'), adr = val('c-adr'), paie = val('c-paie');
  if(!nom || !tel){ toast('Nom et téléphone obligatoires'); return; }
  if(mode2 === 'Livraison' && !adr){ toast('Adresse de livraison obligatoire'); return; }
  const L = lignesPanier();
  if(!L.length){ toast('Votre panier est vide'); return; }
  const total = L.reduce((s, l) => s + l.prix * l.qte, 0);
  db.compteur++;
  dernierNumero = 'CMD-' + String(db.compteur).padStart(4, '0');
  db.commandes.unshift({id:uid('cm'), numero:dernierNumero, client:nom, tel, adresse:adr, mode:mode2, paiement:paie,
    lignes: L.map(l => ({produitId:l.id, nom:l.nom, prix:l.prix, qte:l.qte})), total, statut:'En attente', stockSorti:false, date:nowIso()});
  db.panier = [];
  save(); page = 'confirmation'; mode = 'public'; render(); window.scrollTo(0, 0);
}

function internePage(p){
  switch(p){

    case 'dashboard': {
      const hoy = nowIso();
      const encaisse = db.factures.filter(f => f.statut === 'Payée').reduce((s, f) => s + f.montant, 0);
      const aEncaisser = db.factures.filter(f => f.statut !== 'Payée').reduce((s, f) => s + f.montant, 0);
      const cmdJour = db.commandes.filter(c => c.date === hoy).length;
      const demJour = db.demandes.filter(d => d.date === hoy).length;
      return `
      <div class="tools"><button class="btn ghost sm" onclick="toutOuvrir(true)">Tout ouvrir</button><button class="btn ghost sm" onclick="toutOuvrir(false)">Tout fermer</button></div>
      <details class="acc" open><summary>Activité du jour <span class="pill">${demJour + cmdJour} événement(s)</span></summary>
        ${kpis([
          ['Nouvelles demandes', demJour, 'demandes'],
          ['Commandes du jour', cmdJour, 'commandes'],
          ['Commandes en attente', db.commandes.filter(c => c.statut === 'En attente').length, 'commandes'],
          ['Demandes à traiter', db.demandes.filter(d => d.statut === 'Nouvelle').length, 'demandes']
        ])}
      </details>
      <details class="acc" open><summary>Finances</summary>
        ${kpis([
          ["Chiffre d'affaires encaissé", fcfa(encaisse), 'factures'],
          ['Restant à encaisser', fcfa(aEncaisser), 'factures'],
          ['Factures impayées', db.factures.filter(f => f.statut !== 'Payée').length, 'factures'],
          ['Budget chantiers', fcfa(db.chantiers.reduce((s, c) => s + c.budget, 0)), 'chantiers']
        ])}
      </details>
      <details class="acc" open><summary>Opérations</summary>
        ${kpis([
          ['Chantiers en cours', db.chantiers.filter(c => c.statut === 'En cours').length, 'chantiers'],
          ['Ouvriers disponibles', db.ouvriers.filter(o => !o.absent && !ouvrierOccupe(o.id)).length, 'ouvriers'],
          ['Biens publiés', db.biens.filter(b => b.statut === 'publie').length, 'immobilier'],
          ['Produits en alerte', db.produits.filter(p => p.stock <= p.seuil).length, 'stock']
        ])}
      </details>
      <details class="acc"><summary>Dernières demandes <span class="pill">${db.demandes.length}</span></summary>
        <div class="row" style="margin:0 0 8px"><button class="btn ghost sm" onclick="goI('demandes')">Voir toutes les demandes</button></div>
        ${table(['Date','Type','Client','Besoin','Statut'],
          db.demandes.slice(0, 8).map(d => [d.date, esc(d.type), esc(d.nom), esc(d.sujet || d.message), esc(d.statut)]))}
      </details>`;
    }

    case 'demandes': return table(['Date','Type','Client','Téléphone','Besoin / message','Budget','Statut','Devis'],
      db.demandes.map(d => [d.date, esc(d.type), esc(d.nom), esc(d.tel), `<b>${esc(d.sujet)}</b><br>${esc(d.message)}`, esc(d.budget || '—'), selStatut('setDemande', d.id, STATUT_DEM, d.statut), `<button class="btn sm ghost" onclick="devisDepuisDemande('${d.id}')">Faire un devis</button>`]));

    case 'devis': return pageDevis();

    case 'commandes': return table(['Numéro','Date','Client','Total','Réception','Paiement','Statut','Facture'],
      db.commandes.map(c => {
        const dejaFacture = db.factures.some(f => f.ref === c.numero);
        return [esc(c.numero), c.date, `${esc(c.client)}<br><span class="muted">${esc(c.tel)}</span>`, fcfa(c.total), esc(c.mode) + (c.adresse ? '<br><span class="muted">' + esc(c.adresse) + '</span>' : ''), esc(c.paiement),
          selStatut('setCmdStatut', c.id, STATUT_CMD, c.statut),
          dejaFacture ? '<span class="tag ok">Faite</span>' : `<button class="btn sm ghost" onclick="factureDepuisCommande('${c.id}')">Créer</button>`];
      }));

    case 'factures': return `
      <div class="box"><h3>Nouvelle facture</h3><div class="grid2">
        ${inp('fa-client','Client')}${sel('fa-type','Type',['Vente','Chantier','Location','Autre'])}
      </div><div class="grid2">${inp('fa-ref','Référence (projet, commande)')}${inp('fa-montant','Montant (F CFA)','number')}</div>
      <button class="btn" onclick="ajouterFacture()">Enregistrer la facture</button></div>
      ${table(['Numéro','Date','Client','Type','Référence','Montant','Statut','Action'],
        db.factures.map(f => [esc(f.numero), f.date, esc(f.client), esc(f.type), esc(f.ref), fcfa(f.montant),
          f.statut === 'Payée' ? '<span class="tag ok">Payée</span>' : '<span class="tag ko">Impayée</span>',
          f.statut === 'Payée' ? '' : `<button class="btn sm" onclick="payerFacture('${f.id}')">Marquer payée</button>`]))}`;

    case 'immobilier': return `
      <div class="box"><h3>Ajouter un bien</h3>
        <div class="grid2">${inp('bi-titre','Titre')}${sel('bi-type','Type',['Villa','Maison','Appartement','Terrain','Magasin','Bureau','Entrepôt'])}</div>
        <div class="grid2">${sel('bi-tx','Transaction',['vente','location'])}${inp('bi-prix','Prix (F CFA)','number')}</div>
        <div class="grid2">${inp('bi-ville','Ville')}${inp('bi-quartier','Quartier')}</div>
        <div class="grid2">${inp('bi-surface','Surface (m²)','number')}${inp('bi-chambres','Chambres','number')}</div>
        <div class="fld"><label for="bi-desc">Description</label><textarea id="bi-desc" rows="3"></textarea></div><button class="btn" onclick="ajouterBien()">Publier le bien</button>
      </div>
      ${table(['Titre','Type','Transaction','Prix','Lieu','Statut'],
        db.biens.map(b => [esc(b.titre), esc(b.type), b.transaction === 'vente' ? 'Vente' : 'Location', fcfa(b.prix), esc(b.quartier) + ', ' + esc(b.ville), selStatut('setBienStatut', b.id, STATUT_BIEN, b.statut)]))}`;

    case 'chantiers': return `
      <div class="box"><h3>Nouveau chantier</h3>
        <div class="grid2">${inp('ch-nom','Nom du chantier')}${inp('ch-client','Client')}</div>
        <div class="grid2">${inp('ch-lieu','Lieu')}${inp('ch-budget','Budget (F CFA)','number')}</div>
        <div class="grid2">${inp('ch-debut','Début','date')}${inp('ch-fin','Fin prévue','date')}</div>
        <div class="fld"><label for="ch-desc">Description de l'ouvrage</label><textarea id="ch-desc" rows="3"></textarea></div><button class="btn" onclick="ajouterChantier()">Créer le chantier</button></div>
      <div class="cards">${db.chantiers.map(chantierCard).join('') || '<p class="muted">Aucun chantier.</p>'}</div>`;

    case 'ouvriers': return `
      <div class="box"><h3>Ajouter un ouvrier intégré</h3>
        <div class="grid2">${inp('ou-nom','Nom complet')}${sel('ou-metier','Métier',METIERS_BTP.concat(['Carreleur','Soudeur','Ferrailleur']))}</div>
        <div class="grid2">${inp('ou-exp','Années d\'expérience','number')}${inp('ou-tel','Téléphone')}</div>
        <button class="btn" onclick="ajouterOuvrier()">Ajouter</button></div>
      ${table(['Nom','Métier','Expérience','Téléphone','Statut','Action'],
        db.ouvriers.map(o => {
          const statut = o.absent ? '<span class="tag">Absent</span>' : ouvrierOccupe(o.id) ? '<span class="tag">Sur chantier</span>' : '<span class="tag ok">Disponible</span>';
          return [esc(o.nom), esc(o.metier), o.experience + ' ans', esc(o.tel), statut, `<button class="btn sm ghost" onclick="toggleAbsent('${o.id}')">${o.absent ? 'Rétablir' : 'Marquer absent'}</button>`];
        }))}`;

    case 'personnel': return `
      <div class="box"><h3>Ajouter un membre du personnel</h3>
        <div class="grid2">${inp('pe-nom','Nom complet')}${inp('pe-poste','Poste')}</div>
        <div class="grid2">${sel('pe-dept','Département',['Immobilier','BTP','Décoration','Quincaillerie','Administration'])}${sel('pe-contrat','Contrat',['CDI','CDD','Stage','Prestataire'])}</div>
        ${inp('pe-tel','Téléphone')}
        <button class="btn" onclick="ajouterPersonnel()">Ajouter</button></div>
      ${table(['Nom','Poste','Département','Contrat','Téléphone'],

      db.demandes.forEach(d => add(d.tel, d.nom, 'dem'));
      return table(['Nom','Téléphone','Commandes','Demandes'], Object.values(map).map(x => [esc(x.nom), esc(x.tel), x.cmd, x.dem]));
    }

    case 'planning': {
      const o = db.ouvriers.find(x => x.id === S.ouvrierId);
      if(!o) return '<p class="muted">Aucun profil ouvrier sélectionné.</p>';
      const mes = db.chantiers.filter(c => c.equipe.includes(o.id));
      return `<h2>Bonjour ${esc(o.nom)}</h2>` + (mes.length
        ? mes.map(c => `<article class="card" style="margin-bottom:12px"><h3>${esc(c.nom)}</h3><p>${esc(c.lieu)} · du ${c.debut} au ${c.fin}</p><div class="bar"><span style="width:${c.avancement}%"></span></div><p>Avancement : ${c.avancement}%</p></article>`).join('')
        : '<p class="muted">Aucun chantier affecté pour le moment.</p>');
    }

    case 'parametres': return `
      ${codesHtml()}
      <div class="box"><h3>Informations de l'entreprise</h3>
        <div class="grid2">${inp('s-nom','Nom')}${inp('s-tel','Téléphone')}</div>

      <div class="box"><h3>Signature et cachet (sur les devis)</h3>
        <p class="muted" style="margin-bottom:8px">Image PNG avec fond transparent conseillée, 1,5 Mo maximum.</p>

          <div class="fld"><label>Signature</label><input type="file" accept="image/*" onchange="chargerImage(this,'signature')"></div>
          <div class="fld"><label>Cachet de l'entreprise</label><input type="file" accept="image/*" onchange="chargerImage(this,'cachet')"></div>
        </div>
        <div class="row">${db.signature ? `<img src="${db.signature}" alt="Signature" style="max-height:60px;background:#fff;border:1px solid var(--brume);border-radius:8px;padding:4px"><button class="btn sm ghost" onclick="retirerImage('signature')">Retirer la signature</button>` : ''}</div>
        <div class="row">${db.cachet ? `<img src="${db.cachet}" alt="Cachet" style="max-height:80px;background:#fff;border:1px solid var(--brume);border-radius:8px;padding:4px"><button class="btn sm ghost" onclick="retirerImage('cachet')">Retirer le cachet</button>` : ''}</div>
      </div>
      <div class="box"><h3>Lien de la boutique</h3><p class="muted" style="margin-bottom:8px">À partager avec vos clients. Il ouvre directement la boutique.</p><div class="row" style="margin:0"><button class="btn sm" onclick="lienBoutique()">Copier le lien</button></div></div>
      <div class="box"><h3>Données</h3>

      </div>`;

    default: return '<p>Page introuvable.</p>';
  }
}

/* ===================== ACTIONS INTERNES ===================== */
function setDemande(id, statut){ const d = db.demandes.find(x => x.id === id); if(d){ d.statut = statut; save(); render(); } }

function setCmdStatut(id, statut){
  const c = db.commandes.find(x => x.id === id); if(!c) return;
  if(statut === 'Confirmée' && !c.stockSorti){
    if(!stockSuffisant(c)){ toast('Stock insuffisant pour confirmer cette commande'); render(); return; }
    ajusterStock(c, -1);
  }
  if(statut === 'Annulée' && c.stockSorti){ ajusterStock(c, +1); }
  c.statut = statut; save(); render(); toast(c.numero + ' : ' + statut);
}

function factureDepuisCommande(id){
  const c = db.commandes.find(x => x.id === id); if(!c) return;
  if(db.factures.some(f => f.ref === c.numero)){ toast('Facture déjà créée'); return; }
  db.factures.unshift({id:uid('f'), numero:'FAC-' + String(db.factures.length + 1).padStart(4, '0'), client:c.client, type:'Vente', ref:c.numero, montant:c.total, statut:'Impayée', date:nowIso()});
  save(); render(); toast('Facture créée');
}
function ajouterFacture(){
  const client = val('fa-client'), montant = +val('fa-montant');
  if(!client || !montant){ toast('Client et montant obligatoires'); return; }
  db.factures.unshift({id:uid('f'), numero:'FAC-' + String(db.factures.length + 1).padStart(4, '0'), client, type:val('fa-type'), ref:val('fa-ref'), montant, statut:'Impayée', date:nowIso()});
  save(); render(); toast('Facture enregistrée');
}
function payerFacture(id){ const f = db.factures.find(x => x.id === id); if(f){ f.statut = 'Payée'; save(); render(); toast('Facture marquée payée'); } }

function ajouterBien(){
  const titre = val('bi-titre'), prix = +val('bi-prix');
  if(!titre || !prix){ toast('Titre et prix obligatoires'); return; }
  db.biens.unshift({description:val('bi-desc'), id:uid('b'), titre, type:val('bi-type'), transaction:val('bi-tx'), prix, ville:val('bi-ville'), quartier:val('bi-quartier'), surface:+val('bi-surface')||0, chambres:+val('bi-chambres')||0, statut:'publie'});
  save(); render(); toast('Bien publié');
}
function setBienStatut(id, statut){ const b = db.biens.find(x => x.id === id); if(b){ b.statut = statut; save(); render(); } }

function ajouterChantier(){
  const nom = val('ch-nom'); if(!nom){ toast('Nom du chantier obligatoire'); return; }
  db.chantiers.unshift({description:val('ch-desc'), id:uid('c'), nom, client:val('ch-client'), lieu:val('ch-lieu'), budget:+val('ch-budget')||0, depense:0, avancement:0, equipe:[], debut:val('ch-debut'), fin:val('ch-fin'), statut:'En cours'});
  save(); render(); toast('Chantier créé');
}
function setAvancement(id, v){
  const c = db.chantiers.find(x => x.id === id); if(!c) return;
  c.avancement = +v; c.statut = c.avancement >= 100 ? 'Terminé' : 'En cours';
  save(); render();
}
function ajouterDepense(id){
  const c = db.chantiers.find(x => x.id === id); const v = +val('dep-' + id);
  if(!c || !v || v <= 0){ toast('Montant invalide'); return; }
  c.depense += v; save(); render(); toast('Dépense enregistrée');
}
function ajouterEquipe(id){
  const c = db.chantiers.find(x => x.id === id); const oid = val('eq-' + id);
  if(!c || !oid) return;
  c.equipe.push(oid); save(); render(); toast('Ouvrier affecté');
}

function ajouterOuvrier(){
  const nom = val('ou-nom'); if(!nom){ toast('Nom obligatoire'); return; }
  db.ouvriers.push({id:uid('o'), nom, metier:val('ou-metier'), experience:+val('ou-exp')||0, tel:val('ou-tel'), absent:false});
  save(); render(); toast('Ouvrier ajouté');
}
function toggleAbsent(id){ const o = db.ouvriers.find(x => x.id === id); if(o){ o.absent = !o.absent; save(); render(); } }

function ajouterPersonnel(){
  const nom = val('pe-nom'); if(!nom){ toast('Nom obligatoire'); return; }
  db.personnel.push({id:uid('p'), nom, poste:val('pe-poste'), dept:val('pe-dept'), contrat:val('pe-contrat'), tel:val('pe-tel')});
  save(); render(); toast('Personnel ajouté');
}

function ajouterProduit(){
  const nom = val('pr-nom'), prix = +val('pr-prix'); if(!nom || !prix){ toast('Nom et prix obligatoires'); return; }
  db.produits.push({marque:val('pr-marque'), unite:val('pr-unite'), description:val('pr-desc'), id:uid('q'), nom, cat:val('pr-cat'), prix, stock:+val('pr-stock')||0, seuil:+val('pr-seuil')||0});
  save(); render(); toast('Produit ajouté');
}
function mouvement(id, sens){
  const p = db.produits.find(x => x.id === id); const q = +val('mv-' + id);
  if(!p || !q || q <= 0){ toast('Indiquez une quantité'); return; }
  if(sens < 0 && q > p.stock){ toast('Quantité supérieure au stock'); return; }
  p.stock += sens * q; save(); render(); toast(sens > 0 ? 'Entrée enregistrée' : 'Sortie enregistrée');
}

function saveSociete(){
  db.societe = {nom:val('s-nom') || db.societe.nom, tel:val('s-tel'), adresse:val('s-adr'), whatsapp:val('s-wa')};
  save(); render(); toast('Informations enregistrées');
}
function resetDemo(){
  if(!confirm('Effacer toutes les données enregistrées sur cet appareil ?')) return;
  db = seed(); save(); render(); toast('Données effacées');
}

let draftDevis = null;
const nouveauDraft = (extra = {}) => Object.assign({client:'', tel:'', adresse:'', objet:'', validite:30, remise:0, tva:0, notes:'', lignes:[{desc:'', qte:1, unite:'u', pu:0}]}, extra);
function calcDevis(d){
  const sous = d.lignes.reduce((s, l) => s + (+l.qte || 0) * (+l.pu || 0), 0);
  const remise = sous * (+d.remise || 0) / 100;
  const base = sous - remise;
  const tva = base * (+d.tva || 0) / 100;
  return {sous, remise, base, tva, total: base + tva};
}
function dInp(k, label, num){
  return `<div class="fld"><label for="d-${k}">${label}</label><input id="d-${k}" type="${num ? 'number' : 'text'}" value="${esc(draftDevis[k])}" oninput="setDraft('${k}',this.value,${!!num})"></div>`;
}
function setDraft(k, v, num){ draftDevis[k] = num ? (+v || 0) : v; refreshTotaux(); }
function ligneHtml(l, i){
  return `<tr>
    <td><input value="${esc(l.desc)}" oninput="setLigne(${i},'desc',this.value)"></td>
    <td><input type="number" style="width:70px" value="${l.qte}" oninput="setLigne(${i},'qte',this.value)"></td>
    <td><input style="width:80px" value="${esc(l.unite)}" oninput="setLigne(${i},'unite',this.value)"></td>
    <td><input type="number" style="width:120px" value="${l.pu}" oninput="setLigne(${i},'pu',this.value)"></td>
    <td id="m-${i}" style="white-space:nowrap"><b>${fcfa((+l.qte || 0) * (+l.pu || 0))}</b></td>
    <td><button class="btn sm ghost" onclick="supprLigne(${i})" aria-label="Supprimer la ligne">✕</button></td></tr>`;
}
function setLigne(i, k, v){
  const l = draftDevis.lignes[i]; if(!l) return;
  l[k] = (k === 'desc' || k === 'unite') ? v : (+v || 0);
  const m = $('#m-' + i); if(m) m.innerHTML = '<b>' + fcfa((+l.qte || 0) * (+l.pu || 0)) + '</b>';
  refreshTotaux();
}
function ajouterLigne(){ draftDevis.lignes.push({desc:'', qte:1, unite:'u', pu:0}); render(); }
function supprLigne(i){ if(draftDevis.lignes.length > 1) draftDevis.lignes.splice(i, 1); else draftDevis.lignes[0] = {desc:'', qte:1, unite:'u', pu:0}; render(); }
function refreshTotaux(){ const t = $('#totaux'); if(t) t.innerHTML = totauxHtml(draftDevis); }
function totauxHtml(d){
  const t = calcDevis(d);
  return `<div><span>Sous-total</span><span>${fcfa(t.sous)}</span></div>
    ${d.remise ? `<div><span>Remise (${d.remise}%)</span><span>- ${fcfa(t.remise)}</span></div>` : ''}
    ${d.tva ? `<div><span>TVA (${d.tva}%)</span><span>${fcfa(t.tva)}</span></div>` : ''}
    <div class="grand"><span>TOTAL</span><span>${fcfa(t.total)}</span></div>`;
}
function enregistrerDevis(){
  if(!draftDevis.client){ toast('Indiquez le client'); return; }
  if(!draftDevis.lignes.some(l => l.desc && l.pu > 0)){ toast('Ajoutez au moins une ligne avec un prix'); return; }
  db.compteurDevis = (db.compteurDevis || 0) + 1;
  const d = JSON.parse(JSON.stringify(draftDevis));
  Object.assign(d, {id:uid('dv'), numero:'DEV-' + String(db.compteurDevis).padStart(4, '0'), date:nowIso(), statut:'Brouillon'});
  db.devis.unshift(d); draftDevis = nouveauDraft(); save(); render(); toast(d.numero + ' enregistré');
}
function nouveauDevisVide(){ draftDevis = nouveauDraft(); render(); }
function devisDepuisDemande(id){
  const d = db.demandes.find(x => x.id === id); if(!d) return;
  draftDevis = nouveauDraft({client:d.nom, tel:d.tel, objet:d.sujet || ''});
  goI('devis');
}
function setDevisStatut(id, v){ const d = db.devis.find(x => x.id === id); if(d){ d.statut = v; save(); render(); } }

function voirDevis(id){
  const d = db.devis.find(x => x.id === id); if(!d) return;
  const w = window.open('', '_blank');
  if(!w){ toast('Autorisez les fenêtres pop-up pour voir le devis'); return; }
  w.document.write(devisHtml(d)); w.document.close(); w.focus();
}
function partagerWhatsApp(id){
  const d = db.devis.find(x => x.id === id); if(!d) return;
  const t = calcDevis(d);
  const txt = `Bonjour ${d.client}, voici votre devis ${d.numero} de ${db.societe.nom}.` +
    (d.objet ? `\nObjet : ${d.objet}` : '') +
    `\nMontant total : ${fcfa(t.total)}\nValidité : ${d.validite} jours.` +
    (db.societe.tel ? `\n\nContact : ${db.societe.tel}` : '');
  let num = (d.tel || '').replace(/[^0-9]/g, '');
  if(num.length === 9) num = '221' + num;
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`, '_blank');
  if(d.statut === 'Brouillon'){ d.statut = 'Envoyé'; save(); render(); }
}

function chargerImage(input, cle){
  const f = input.files[0]; if(!f) return;
  if(f.size > 1500000){ toast('Image trop lourde (1,5 Mo maximum)'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = () => { db[cle] = r.result; save(); render(); toast('Image enregistrée'); };
  r.readAsDataURL(f);
}
function retirerImage(cle){ db[cle] = ''; save(); render(); }

    <div class="grid2">${dInp('validite','Validité (jours)',true)}${dInp('remise','Remise (%)',true)}${dInp('tva','TVA (%)',true)}</div>
    <h3 style="margin-top:14px">Lignes</h3>
    <div class="tw"><table><thead><tr><th>Désignation</th><th>Qté</th><th>Unité</th><th>P.U. (F CFA)</th><th>Montant</th><th></th></tr></thead>
      <tbody>${draftDevis.lignes.map(ligneHtml).join('')}</tbody></table></div>
    <button class="btn ghost sm" onclick="ajouterLigne()">+ Ajouter une ligne</button>
    <div class="totaux" id="totaux">${totauxHtml(draftDevis)}</div>
    <div class="fld" style="margin-top:12px"><label for="d-notes">Notes / conditions</label><textarea id="d-notes" rows="3" oninput="draftDevis.notes=this.value">${esc(draftDevis.notes)}</textarea></div>
    <div class="row"><button class="btn" onclick="enregistrerDevis()">Enregistrer le devis</button><button class="btn ghost" onclick="nouveauDevisVide()">Vider</button></div>
  </div>
  <h2 style="margin-top:18px">Devis enregistrés</h2>
  ${table(['Numéro','Date','Client','Objet','Total','Statut','Actions'], liste)}`;
}

/* ===================== DÉMARRAGE ===================== */
db = load() || seed();
db.devis = db.devis || []; db.compteurDevis = db.compteurDevis || 0; db.signature = db.signature || ''; db.cachet = db.cachet || '';
save();
mode = location.hash === SHOP_HASH ? 'public' : 'login';
render();
</script>
